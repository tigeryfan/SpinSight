<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SpinSight — Mockup</title>
  <script>
    // Apply saved theme before paint to avoid a light-mode flash.
    (function () {
      try {
        var t = localStorage.getItem("spinsight-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* localStorage may be blocked */ }
    })();
  </script>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e4e4e7;
      --accent: #2563eb;
      --wash: #60a5fa;
      --dry: #fb923c;
      --running: #10b981;
      --warn: #f59e0b;
      --done: #9ca3af;
      --idle: #e5e7eb;
      --bg-wash: color-mix(in srgb, var(--wash) 22%, transparent);
      --bg-dry: color-mix(in srgb, var(--dry) 22%, transparent);
      --pill-bg: #ffffff;
      --pill-bg-active: #111827;
      --pill-ink-active: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0f12;
        --panel: #181a1f;
        --ink: #f3f4f6;
        --muted: #9aa1ab;
        --line: #2a2d33;
        --accent: #60a5fa;
        --wash: #60a5fa;
        --dry: #fb923c;
        --running: #10b981;
        --warn: #fbbf24;
        --done: #6b7280;
        --idle: #232529;
        --pill-bg: #181a1f;
        --pill-bg-active: #f3f4f6;
        --pill-ink-active: #0e0f12;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e0f12;
      --panel: #181a1f;
      --ink: #f3f4f6;
      --muted: #9aa1ab;
      --line: #2a2d33;
      --accent: #60a5fa;
      --wash: #60a5fa;
      --dry: #fb923c;
      --running: #10b981;
      --warn: #fbbf24;
      --done: #6b7280;
      --idle: #232529;
      --pill-bg: #181a1f;
      --pill-bg-active: #f3f4f6;
      --pill-ink-active: #0e0f12;
    }
    :root[data-theme="light"] {
      --wash: #60a5fa;
      --dry: #fb923c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 24px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 20px; }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .theme-icon { display: inline-flex; width: 14px; height: 14px; color: var(--muted); }
    .theme-icon svg { width: 100%; height: 100%; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--pill-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
    }
    .pill.active {
      background: var(--pill-bg-active);
      color: var(--pill-ink-active);
      border-color: var(--pill-bg-active);
    }
    .pill.icon-pill {
      width: 38px;
      height: 36px;
      padding: 0;
      justify-content: center;
    }
    .pills > .pill { height: 38px; }
    .pill .dot {
      width: 8px; height: 8px; border-radius: 999px; background: var(--muted);
    }
    .dorm-picker { position: relative; }
    .dorm-picker > .pill { height: 38px; }
    .dorm-chevron { width: 12px; height: 12px; color: var(--muted); }
    .dorm-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 20;
      min-width: 180px;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px color-mix(in srgb, black 16%, transparent);
    }
    .dorm-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .dorm-option:hover, .dorm-option:focus-visible { background: var(--bg); }
    .dorm-option[aria-checked="true"] { background: var(--pill-bg-active); color: var(--pill-ink-active); }
    .dorm-option::after { content: "✓"; visibility: hidden; }
    .dorm-option[aria-checked="true"]::after { visibility: visible; }
    .dorm-picker button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .group { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; gap: 2px; }
    .group .pill { border: 0; background: transparent; padding: 6px 12px; }
    .group .pill.active { background: var(--pill-bg-active); color: var(--pill-ink-active); }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .stat {
      flex: 1 0 160px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 16px;
      min-width: 160px;
    }
    .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .stat .value { font-size: 22px; font-weight: 600; margin-top: auto; white-space: nowrap; }
    .stat .value .sub { font-size: 13px; color: var(--muted); font-weight: 500; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    .range { position: relative; display: inline-flex; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; gap: 2px; flex-wrap: nowrap; user-select: none; touch-action: pan-y; }
    .range .pill { position: relative; z-index: 1; border: 0; background: transparent; padding: 6px 12px; cursor: grab; transition: color .2s ease; }
    .range .pill:active { cursor: grabbing; }
    .range .pill.active { background: transparent; color: var(--pill-ink-active); }
    .range-thumb {
      position: absolute;
      top: 0; left: 0;
      background: var(--pill-bg-active);
      border-radius: 6px;
      pointer-events: none;
      z-index: 0;
      transition:
        left   .28s cubic-bezier(.4, 0, .2, 1),
        top    .28s cubic-bezier(.4, 0, .2, 1),
        width  .28s cubic-bezier(.4, 0, .2, 1),
        height .28s cubic-bezier(.4, 0, .2, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .range-thumb, .range .pill { transition: none; }
    }

    .chart-panel { padding: 20px 22px 16px; border-radius: 14px; }
    .chart-panel .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-bottom: 24px;
    }
    .chart-panel .legend { display: inline-flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); font-weight: 500; }
    .chart-panel .legend .lg { display: inline-flex; align-items: center; gap: 7px; }
    .chart-panel .legend .sw { width: 18px; height: 3px; border-radius: 999px; display: inline-block; }

    .chart-svg { display: block; width: 100%; height: 260px; }
    .chart-svg line.grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 5; opacity: 0.8; vector-effect: non-scaling-stroke; }
    .chart-svg .axis-line { stroke: var(--line); stroke-width: 1; opacity: 0.9; vector-effect: non-scaling-stroke; }
    .chart-svg text.axis {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
    }
    .chart-svg .area { opacity: 1; }
    .chart-svg .series-w,
    .chart-svg .series-d {
      fill: none;
      stroke-width: 2.25;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .chart-svg .series-w { stroke: var(--wash); }
    .chart-svg .series-d { stroke: var(--dry); }
    .chart-svg .hover-line,
    .chart-svg .hover-dot {
      pointer-events: none;
      opacity: 0;
      transition: transform .14s cubic-bezier(.16, 1, .3, 1), opacity .12s ease-out;
      vector-effect: non-scaling-stroke;
    }
    .chart-svg .hover-line {
      stroke: var(--muted);
      stroke-width: 1;
      stroke-dasharray: 3 4;
    }
    .chart-svg .hover-dot {
      stroke: var(--panel);
      stroke-width: 2;
    }

    .chart-wrap { position: relative; min-width: 0; }
    .chart-tooltip {
      position: absolute;
      top: 0;
      left: 0;
      padding: 10px 12px;
      min-width: 144px;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      font-size: 12px;
      border-radius: 10px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: transform .14s cubic-bezier(.16, 1, .3, 1), opacity .12s ease-out;
      box-shadow: 0 8px 24px color-mix(in srgb, black 16%, transparent), 0 2px 6px color-mix(in srgb, black 6%, transparent);
      z-index: 5;
    }
    .chart-tooltip .tt-label { font-weight: 600; display: block; margin-bottom: 7px; }
    .chart-tooltip .tt-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-variant-numeric: tabular-nums;
      padding: 2px 0;
    }
    .chart-tooltip .tt-series-name { color: var(--muted); }
    .chart-tooltip .tt-value { margin-left: auto; padding-left: 16px; font-weight: 600; }
    .chart-tooltip .sw {
      width: 8px; height: 8px;
      border-radius: 999px;
      display: inline-block;
      flex: none;
    }
    .chart-tooltip .sw-w { background: var(--wash); }
    .chart-tooltip .sw-d { background: var(--dry); }

    @media (max-width: 560px) {
      .chart-panel { padding: 16px 12px 12px; }
      .chart-panel .chart-header { margin-bottom: 20px; gap: 12px 20px; }
      .chart-header .range { width: 100%; gap: 0; }
      .chart-header .range .pill { flex: 1 1 0; min-width: 0; justify-content: center; padding: 7px 4px; font-size: 11px; }
      .chart-svg { height: 240px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chart-svg .hover-line, .chart-svg .hover-dot, .chart-tooltip { transition: none; }
    }

    .hidden { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr));
      gap: 10px;
    }
    .machine {
      --machine-color: var(--wash);
      min-width: 0;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 15px 16px;
      background: var(--panel);
      transition: border-color .15s ease;
    }
    .machine:hover { border-color: var(--muted); }
    .machine.dry { --machine-color: var(--dry); }
    .machine .progress-track {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
      background: color-mix(in srgb, var(--machine-color) 5%, transparent);
    }
    .machine .progress-fill {
      height: 100%;
      width: var(--p, 0%);
      background: color-mix(in srgb, var(--machine-color) 28%, transparent);
    }
    .machine.completed .progress-fill { opacity: .55; }
    .machine .row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .machine .pip {
      width: 10px; height: 10px;
      border-radius: 999px;
      background: var(--done);
      flex-shrink: 0;
    }
    .machine.completed .pip { background: var(--warn); }
    .machine.running .pip { background: var(--running); }
    .machine .name {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 13px;
    }
    .machine .status {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .machine.running .status { color: var(--ink); font-weight: 500; }
    .machine:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .machine .tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      min-width: 180px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--ink);
      color: var(--bg);
      font-size: 11px;
      text-align: left;
      box-shadow: 0 4px 16px color-mix(in srgb, black 25%, transparent);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .15s ease, transform .15s ease;
      z-index: 10;
    }
    .machine .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      right: 12px;
      border: 5px solid transparent;
      border-top-color: var(--ink);
    }
    .machine .tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 2px 0;
    }
    .machine .tooltip .tt-row .tt-label {
      color: color-mix(in srgb, var(--bg) 70%, transparent);
    }
    .machine .tooltip .tt-divider {
      height: 1px;
      margin: 4px -2px;
      background: color-mix(in srgb, var(--bg) 25%, transparent);
    }

    .refresh-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
    }
    .refresh-icon svg { display: block; width: 100%; height: 100%; }
    .refresh-icon.is-spinning {
      animation: refresh-spin .275s cubic-bezier(.2, 0, .2, 1);
    }
    @keyframes refresh-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(180deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .refresh-icon.is-spinning { animation: none; }
    }
    .machine:hover .tooltip, .machine:focus-visible .tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    section.machines h2 .pill-tag {
      display: inline-block; font-size: 11px; color: var(--muted);
      background: var(--bg); padding: 2px 8px; border-radius: 6px; margin-left: 6px;
      text-transform: none; letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SpinSight</h1>
      <div class="pills">
        <button class="pill icon-pill" id="refresh" type="button" aria-label="Refresh dashboard" title="Refresh dashboard">
          <span class="refresh-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.364-6.364L21 8m0-5v5h-5"/><path d="M21 12a9 9 0 0 1-15.364 6.364L3 16m5 0H3v5"/></svg>
          </span>
        </button>
        <button class="pill" id="themeToggle" type="button" aria-label="Toggle theme" title="Theme: Auto">
          <span class="theme-icon" id="themeIcon" aria-hidden="true"></span>
          <span class="theme-label" id="themeLabel">Auto</span>
        </button>
        <div class="dorm-picker" id="dormPicker">
          <button class="pill" id="dormToggle" type="button" aria-label="Dorm: All Dorms" aria-haspopup="menu" aria-expanded="false" aria-controls="dormMenu">
            <span class="dot" style="background: var(--accent)" aria-hidden="true"></span>
            <span id="dormLabel">All Dorms</span>
            <svg class="dorm-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
          </button>
          <div class="dorm-menu" id="dormMenu" role="menu" aria-label="Dorm" hidden></div>
        </div>
      </div>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="label">Washers Available</div>
        <div class="value"><span id="washersAvailable">—</span> <span class="sub">/ <span id="washersTotal">—</span></span></div>
      </div>
      <div class="stat">
        <div class="label">Dryers Available</div>
        <div class="value"><span id="dryersAvailable">—</span> <span class="sub">/ <span id="dryersTotal">—</span></span></div>
      </div>
      <div class="stat">
        <div class="label">Next washer to free up</div>
        <div class="value" id="nextWasherFree">—</div>
      </div>
      <div class="stat">
        <div class="label">Next dryer to free up</div>
        <div class="value" id="nextDryerFree">—</div>
      </div>
    </div>

    <div class="panel chart-panel" role="region" aria-label="Usage for last full week, Monday through Sunday">
      <div class="chart-header">
        <div class="range" role="tablist" aria-label="Last full week, Monday through Sunday">
          <span class="range-thumb" aria-hidden="true"></span>
          <button class="pill active" data-view="week">Week</button>
          <button class="pill" data-view="day" data-day="0">Mon</button>
          <button class="pill" data-view="day" data-day="1">Tue</button>
          <button class="pill" data-view="day" data-day="2">Wed</button>
          <button class="pill" data-view="day" data-day="3">Thu</button>
          <button class="pill" data-view="day" data-day="4">Fri</button>
          <button class="pill" data-view="day" data-day="5">Sat</button>
          <button class="pill" data-view="day" data-day="6">Sun</button>
        </div>
        <div class="legend"><span class="lg"><span class="sw" style="background: var(--wash)" aria-hidden="true"></span>Washers</span><span class="lg"><span class="sw" style="background: var(--dry)" aria-hidden="true"></span>Dryers</span></div>
      </div>
      <div class="chart-wrap" id="weekPanel">
        <svg class="chart-svg" id="weekChart" viewBox="0 0 700 240" preserveAspectRatio="none" aria-label="Washers and dryers in use, last full week, Monday through Sunday"></svg>
        <div class="chart-tooltip" id="weekTooltip"></div>
      </div>
      <div class="chart-wrap hidden" id="dayPanel">
        <svg class="chart-svg" id="dayChart" viewBox="0 0 700 240" preserveAspectRatio="none" aria-label="Washers and dryers in use, 24 hour view"></svg>
        <div class="chart-tooltip" id="dayTooltip"></div>
      </div>
    </div>

    <div class="panel machines">
      <h2>Machines <span class="pill-tag" id="dormTag">All Dorms</span></h2>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <script>
    // Values below come from example_state.json. Each dorm receives three washers and three dryers.
    const MOCK_DORMS = ["Upper Dorms", "Alamo", "North Hutch", "South Hutch", "Appleby", "Jones", "Jameson"];
    const SOURCE_MACHINES = [
      ["D1", "Dryer", "Running", true], ["D2", "Dryer", "Completed", false], ["D3", "Dryer", "Completed", false],
      ["D4", "Dryer", "Completed", false], ["D5", "Dryer", "Running", true], ["D6", "Dryer", "Completed", false],
      ["D7", "Dryer", "Running", true], ["D8", "Dryer", "Completed", false], ["D9", "Dryer", "Completed", false],
      ["D10", "Dryer", "Completed", false], ["D11", "Dryer", "Completed", false], ["D12", "Dryer", "Completed", false],
      ["D13", "Dryer", "Running", true], ["D14", "Dryer", "Completed", false], ["D15", "Dryer", "Completed", false],
      ["D16", "Dryer", "Completed", false], ["D17", "Dryer", "Completed", false], ["D18", "Dryer", "Running", true],
      ["D19", "Dryer", "Running", true], ["D20", "Dryer", "Completed", false], ["D21", "Dryer", "Running", true],
      ["W1", "Washer", "Completed", false], ["W2", "Washer", "Completed", false], ["W3", "Washer", "Completed", false],
      ["W4", "Washer", "Completed", false], ["W5", "Washer", "Completed", false], ["W6", "Washer", "Completed", false],
      ["W7", "Washer", "Running", false], ["W8", "Washer", "Completed", false], ["W9", "Washer", "Completed", false],
      ["W10", "Washer", "Completed", false], ["W11", "Washer", "Completed", false], ["W12", "Washer", "Completed", false],
      ["W13", "Washer", "Completed", false], ["W14", "Washer", "Completed", false], ["W15", "Washer", "Completed", false],
      ["W16", "Washer", "Completed", false], ["W17", "Washer", "Completed", false], ["W18", "Washer", "Completed", false],
      ["W19", "Washer", "Completed", false], ["W20", "Washer", "Completed", false], ["W21", "Washer", "Completed", false],
    ];
    const machines = SOURCE_MACHINES.map(([machineName, machineType, status, topOffAvailable], index) => ({
      dorm: MOCK_DORMS[Math.floor((index % 21) / 3)],
      machineName,
      machineType,
      status,
      topOffAvailable,
      multiTopOffAvailable: false,
      superCycleAvailable: false,
      topOffCost: null,
      minutesPerTopOff: null,
      progress: status === "Running" ? 0.35 + (index % 3) * 0.2 : undefined,
    }));

    // Mock usage stats: deterministic per-machine hours and a per-dorm bias.
    (function () {
      function hash(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) | 0;
        return Math.abs(h);
      }
      const dormBias = {
        "Upper Dorms": 1.2, "Alamo": 0.8, "North Hutch": 1.0, "South Hutch": 1.1,
        "Appleby": 0.9, "Jones": 1.0, "Jameson": 0.85,
      };
      for (const m of machines) {
        const h = hash(m.dorm + "|" + m.machineName + "|" + m.machineType);
        const base = (h % 220) / 10;            // 0 - 22
        const bias = dormBias[m.dorm] || 1;
        m.usageHoursPastWeek = Math.max(0.5, Math.round(base * bias * 10) / 10);
      }
    })();

    const grid = document.getElementById("grid");
    const dormTag = document.getElementById("dormTag");
    let selectedDorm = "All Dorms";
    const dormPicker = document.getElementById("dormPicker");
    const dormToggle = document.getElementById("dormToggle");
    const dormMenu = document.getElementById("dormMenu");
    const dormOptions = ["All Dorms", ...MOCK_DORMS].map(dorm => {
      const option = document.createElement("button");
      option.type = "button";
      option.className = "dorm-option";
      option.textContent = dorm;
      option.setAttribute("role", "menuitemradio");
      option.setAttribute("aria-checked", String(dorm === selectedDorm));
      option.tabIndex = -1;
      option.addEventListener("click", () => {
        selectedDorm = dorm;
        document.getElementById("dormLabel").textContent = dorm;
        dormToggle.setAttribute("aria-label", `Dorm: ${dorm}`);
        dormOptions.forEach(item => item.setAttribute("aria-checked", String(item === option)));
        closeDormMenu(true);
        renderAll();
      });
      dormMenu.append(option);
      return option;
    });
    function closeDormMenu(restoreFocus = false) {
      dormMenu.hidden = true;
      dormToggle.setAttribute("aria-expanded", "false");
      if (restoreFocus) dormToggle.focus();
    }
    function openDormMenu() {
      dormMenu.hidden = false;
      dormToggle.setAttribute("aria-expanded", "true");
      dormOptions.find(option => option.getAttribute("aria-checked") === "true").focus();
    }
    dormToggle.addEventListener("click", () => dormMenu.hidden ? openDormMenu() : closeDormMenu());
    dormToggle.addEventListener("keydown", event => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        openDormMenu();
      }
    });
    dormPicker.addEventListener("keydown", event => {
      if (dormMenu.hidden) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeDormMenu(true);
      }
      if (!dormMenu.contains(event.target)) return;
      const index = dormOptions.indexOf(document.activeElement);
      let next;
      if (event.key === "ArrowDown") next = (index + 1) % dormOptions.length;
      if (event.key === "ArrowUp") next = (index - 1 + dormOptions.length) % dormOptions.length;
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = dormOptions.length - 1;
      if (next !== undefined) {
        event.preventDefault();
        dormOptions[next].focus();
      }
    });
    document.addEventListener("pointerdown", event => {
      if (!dormPicker.contains(event.target)) closeDormMenu();
    });
    dormPicker.addEventListener("focusout", event => {
      if (!dormPicker.contains(event.relatedTarget)) closeDormMenu();
    });

    function getFiltered() {
      const sel = selectedDorm;
      return sel === "All Dorms" ? machines : machines.filter(m => m.dorm === sel);
    }

    function render() {
      const list = getFiltered();
      dormTag.textContent = selectedDorm;

      // Rank machines by weekly usage within the filtered set, per machine type.
      const byType = { Washer: [], Dryer: [] };
      for (const m of list) byType[m.machineType] && byType[m.machineType].push(m);
      for (const arr of Object.values(byType)) {
        arr.sort((a, b) => (b.usageHoursPastWeek || 0) - (a.usageHoursPastWeek || 0));
        arr.forEach((m, i) => { m._rank = i + 1; m._rankTotal = arr.length; });
      }

      const displayList = [
        ...list.filter(m => m.machineType === "Washer"),
        ...list.filter(m => m.machineType === "Dryer"),
      ];
      grid.innerHTML = displayList.map(m => {
        const pct = m.status === "Running"
          ? Math.round(Math.max(0, Math.min(1, m.progress ?? 0.5)) * 100)
          : m.status === "Completed" ? 100 : 0;
        const klass = m.status.toLowerCase();
        const kindClass = m.machineType === "Washer" ? "wash" : "dry";
        const eta = m.status === "Running"
          ? `${Math.max(1, Math.round((1 - (m.progress ?? 0)) * 35))}m left`
          : m.status === "Completed" ? "Awaiting Unload" : "Available";

        // Always show stats; append optional fields only when present.
        const hours = (m.usageHoursPastWeek ?? 0).toFixed(1);
        const rank  = m._rank || 1;
        const total = m._rankTotal || 1;
        const ttRows = [
          `<div class="tt-row"><span class="tt-label">Last Mon–Sun Usage</span><span>${hours}h</span></div>`,
          `<div class="tt-row"><span class="tt-label">Usage Rank</span><span>#${rank} of ${total}</span></div>`,
        ];
        let hasExtras = false;
        if (m.topOffAvailable === true) {
          ttRows.push(`<div class="tt-row"><span class="tt-label">Top Off</span><span>Available</span></div>`);
          hasExtras = true;
        }
        if (typeof m.minutesPerTopOff === "number" && m.minutesPerTopOff > 0) {
          ttRows.push(`<div class="tt-row"><span class="tt-label">Per Top Off</span><span>+${m.minutesPerTopOff} min</span></div>`);
          hasExtras = true;
        }
        if (typeof m.topOffCost === "number") {
          ttRows.push(`<div class="tt-row"><span class="tt-label">Cost</span><span>+$${m.topOffCost.toFixed(2)}</span></div>`);
          hasExtras = true;
        }
        if (m.multiTopOffAvailable === true) {
          ttRows.push(`<div class="tt-row"><span class="tt-label">Multi Top Off</span><span>2×</span></div>`);
          hasExtras = true;
        }
        if (m.superCycleAvailable === true) {
          ttRows.push(`<div class="tt-row"><span class="tt-label">Super cycle</span><span>Available</span></div>`);
          hasExtras = true;
        }
        if (hasExtras) {
          // Insert a divider between stats and optional fields.
          ttRows.splice(2, 0, `<div class="tt-divider"></div>`);
        }
        const tooltip = `<div class="tooltip" role="tooltip">${ttRows.join("")}</div>`;

        return `
          <div class="machine ${klass} ${kindClass}" style="--p: ${pct}%" tabindex="0">
            <div class="row">
              <span class="pip" aria-hidden="true"></span>
              <span class="name">${m.machineName}</span>
              <span class="status"><span>${eta}</span></span>
            </div>
            <div class="progress-track" ${m.status === "Running"
              ? `role="progressbar" aria-label="${m.dorm} ${m.machineName} cycle progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-valuetext="${pct}% complete, ${eta}"`
              : 'aria-hidden="true"'}>
              <div class="progress-fill"></div>
            </div>
            ${tooltip}
          </div>`;
      }).join("");

      // Stats reflect the filtered set.
      const washers = list.filter(m => m.machineType === "Washer");
      const dryers  = list.filter(m => m.machineType === "Dryer");
      document.getElementById("washersAvailable").textContent = washers.length - washers.filter(m => m.status === "Running").length;
      document.getElementById("washersTotal").textContent     = washers.length;
      document.getElementById("dryersAvailable").textContent  = dryers.length  - dryers.filter(m => m.status === "Running").length;
      document.getElementById("dryersTotal").textContent      = dryers.length;

      const runners = list
        .filter(m => m.status === "Running")
        .map(m => ({ ...m, minsLeft: Math.max(1, Math.round((1 - (m.progress ?? 0)) * 35)) }))
        .sort((a, b) => a.minsLeft - b.minsLeft);
      for (const [type, id] of [["Washer", "nextWasherFree"], ["Dryer", "nextDryerFree"]]) {
        const next = runners.find(m => m.machineType === type);
        document.getElementById(id).innerHTML = next
          ? `${next.machineName} <span class="sub">in ${next.minsLeft}m</span>`
          : `<span class="sub">No active cycles</span>`;
      }
    }

    let currentView = "week";
    let currentDayIdx = 6; // default to "Sun" — matches WEEK_LABELS index 6

    // Hoisted above renderAll() so they're not in TDZ on the first call.
    const WEEK_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const DAY_NAMES   = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    // Module-level chart payloads, read by the hover handlers attached below.
    let currentWeekPayload = null;
    let currentDayPayload  = null;

    function renderAll() { render(); renderCharts(true); }
    renderAll();

    // ---------- Charts ----------
    // (WEEK_LABELS and DAY_NAMES hoisted above renderAll() to avoid TDZ.)

    // Mock weekly usage: 7 days, machines-in-use counts per dorm filtered set.
    function weeklySeries(list) {
      const capW = Math.max(1, list.filter(m => m.machineType === "Washer").length);
      const capD = Math.max(1, list.filter(m => m.machineType === "Dryer").length);
      const nowW = list.filter(m => m.machineType === "Washer" && m.status === "Running").length;
      const nowD = list.filter(m => m.machineType === "Dryer"  && m.status === "Running").length;
      const seed = (capW * 7) + (nowW * 13) + (nowD * 17);
      const rnd  = (() => { let s = seed || 1; return () => (s = (s * 9301 + 49297) % 233280) / 233280; })();
      const w = [], d = [];
      for (let i = 0; i < 7; i++) {
        w.push(Math.round(capW * (0.35 + rnd() * 0.55)));
        d.push(Math.round(capD * (0.35 + rnd() * 0.55)));
      }
      // Anchor "today" near the live running counts so the chart connects to the stats card.
      w[6] = nowW;
      d[6] = nowD;
      return { w, d, capW, capD };
    }

    // Mock 24-hour usage for a given day index. Returns 24 (hour -> count) for W and D.
    function dailySeries(list, dayIdx) {
      const capW = Math.max(1, list.filter(m => m.machineType === "Washer").length);
      const capD = Math.max(1, list.filter(m => m.machineType === "Dryer").length);
      const nowW = list.filter(m => m.machineType === "Washer" && m.status === "Running").length;
      const nowD = list.filter(m => m.machineType === "Dryer"  && m.status === "Running").length;
      const seed = (dayIdx + 1) * 91 + capW * 5 + capD * 11;
      const rnd  = (() => { let s = seed || 1; return () => (s = (s * 9301 + 49297) % 233280) / 233280; })();
      const w = [], d = [];
      // Shape: low overnight, ramp 8-11, dip mid-day, peak 6-10pm.
      const profile = [
        0.05,0.04,0.03,0.03,0.04,0.06,0.10,0.18,
        0.32,0.48,0.58,0.55,0.45,0.42,0.46,0.55,
        0.68,0.80,0.92,0.95,0.88,0.72,0.45,0.20
      ];
      for (let h = 0; h < 24; h++) {
        const j = profile[h] + (rnd() - 0.5) * 0.12;
        w.push(Math.max(0, Math.min(capW, Math.round(capW * j))));
        d.push(Math.max(0, Math.min(capD, Math.round(capD * (j * 0.85 + 0.05)))));
      }
      const hourNow = new Date().getHours();
      w[hourNow] = nowW;
      d[hourNow] = nowD;
      return { w, d, capW, capD };
    }

    function stopChartAnimation(svg) {
      svg.chartAnimation?.cancel();
      svg.chartAnimation = null;
    }

    function svgLine(svg, series, labels, opts) {
      const hadChart = Boolean(svg.dataset.W);
      stopChartAnimation(svg);
      const tooltip = svg.parentElement?.querySelector(".chart-tooltip");
      if (tooltip) tooltip.style.opacity = "0";
      // Match the viewBox to the layout so labels and dots keep their size.
      const W = svg.clientWidth || 700, H = svg.clientHeight || 240;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const padL = 44, padR = 16, padT = 16, padB = 28;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;
      const n = labels.length;
      const yMax = Math.max(1, opts.capW, opts.capD, ...series.w, ...series.d);
      const xStep = n > 1 ? innerW / (n - 1) : 0;
      const y = v => padT + innerH - (v / yMax) * innerH;
      const x = i => padL + i * xStep;

      const washFill = `${svg.id}-wash-fill`;
      const dryFill = `${svg.id}-dry-fill`;
      let out = `<defs>
        <linearGradient id="${washFill}" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${padT}" y2="${padT + innerH}">
          <stop offset="0%" stop-color="var(--wash)" stop-opacity=".18"/>
          <stop offset="100%" stop-color="var(--wash)" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="${dryFill}" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${padT}" y2="${padT + innerH}">
          <stop offset="0%" stop-color="var(--dry)" stop-opacity=".14"/>
          <stop offset="100%" stop-color="var(--dry)" stop-opacity="0"/>
        </linearGradient>
      </defs>`;

      // Y-axis: 4 gridlines + matching labels (same `.axis` style as the x-axis).
      const tickStep = Math.max(1, Math.ceil(yMax / 4));
      for (let v = 0; v <= yMax; v += tickStep) {
        if (v > 0 && v + tickStep > yMax) v = yMax; // snap final tick to max
        const yy = y(v).toFixed(1);
        if (v > 0) out += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/>`;
        out += `<text class="axis" x="${padL - 8}" y="${(parseFloat(yy) + 3).toFixed(1)}" text-anchor="end">${v}</text>`;
        if (v === yMax) break;
      }

      // Subtle baseline so the x-axis has the same visual weight as the gridlines.
      out += `<line class="axis-line" x1="${padL}" x2="${W - padR}" y1="${(padT + innerH).toFixed(1)}" y2="${(padT + innerH).toFixed(1)}"/>`;

      // Fade the fills toward the baseline; keep the actual samples unchanged.
      const areaFor = arr => {
        let p = "";
        for (let i = 0; i < n; i++) p += (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(arr[i]).toFixed(1);
        p += `L${x(n - 1).toFixed(1)},${(padT + innerH).toFixed(1)}L${padL.toFixed(1)},${(padT + innerH).toFixed(1)}Z`;
        return p;
      };
      out += `<g class="chart-data">`;
      out += `<path class="area area-w" fill="url(#${washFill})" d="${areaFor(series.w)}"/>`;
      out += `<path class="area area-d" fill="url(#${dryFill})" d="${areaFor(series.d)}"/>`;

      const lineFor = arr => arr.map((v, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      out += `<path class="series series-w" d="${lineFor(series.w)}"/>`;
      out += `<path class="series series-d" d="${lineFor(series.d)}"/>`;
      out += `</g>`;

      // X-axis labels (inline — no duplicate div below).
      const stride = opts.skipXStride ?? 1;
      for (let i = 0; i < n; i++) {
        if (i % stride !== 0 && i !== n - 1) continue;
        const xx = x(i).toFixed(1);
        const yy = (H - 10).toFixed(1);
        out += `<text class="axis" x="${xx}" y="${yy}" text-anchor="middle">${labels[i]}</text>`;
      }

      // Hover overlay (hidden by default; toggled by attachChartHover).
      out += `<line class="hover-line hover-line-x" x1="0" x2="0" y1="${padT}" y2="${(padT + innerH).toFixed(1)}"/>`;
      out += `<line class="hover-line hover-line-y-w" x1="${padL}" x2="${padL + innerW}" y1="0" y2="0"/>`;
      out += `<line class="hover-line hover-line-y-d" x1="${padL}" x2="${padL + innerW}" y1="0" y2="0"/>`;
      out += `<circle class="hover-dot hover-dot-w" fill="var(--wash)" cx="0" cy="0" r="4"/>`;
      out += `<circle class="hover-dot hover-dot-d" fill="var(--dry)" cx="0" cy="0" r="4"/>`;

      svg.innerHTML = out;

      // Layout data the hover handler needs (avoids re-deriving W/H from the DOM).
      svg.dataset.padL = padL;
      svg.dataset.padR = padR;
      svg.dataset.padT = padT;
      svg.dataset.padB = padB;
      svg.dataset.innerW = innerW;
      svg.dataset.innerH = innerH;
      svg.dataset.yMax = yMax;
      svg.dataset.W = W;
      svg.dataset.H = H;

      if (opts.animate && hadChart && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        svg.chartAnimation = svg.querySelector(".chart-data").animate(
          [{ opacity: 0.5 }, { opacity: 1 }],
          { duration: 180, easing: "cubic-bezier(0.16, 1, 0.3, 1)" }
        );
      }
    }

    // Latest payloads, read by the hover handlers attached below.
    // (Bindings declared near the top of the chart section so renderAll() — called
    // at init before this point in the source — doesn't trip TDZ.)

    function renderCharts(animate = false) {
      const list = getFiltered();
      const w = weeklySeries(list);
      currentWeekPayload = { series: { w: w.w, d: w.d }, labels: WEEK_LABELS, capW: w.capW, capD: w.capD };
      svgLine(document.getElementById("weekChart"), currentWeekPayload.series, WEEK_LABELS, { capW: w.capW, capD: w.capD, animate: animate && currentView === "week" });

      const dayIdx = currentDayIdx;
      const d = dailySeries(list, dayIdx);
      const hourLabels = Array.from({ length: 24 }, (_, h) => `${h}:00`);
      currentDayPayload = { series: { w: d.w, d: d.d }, labels: hourLabels, capW: d.capW, capD: d.capD };
      svgLine(document.getElementById("dayChart"), currentDayPayload.series, hourLabels, { capW: d.capW, capD: d.capD, skipXStride: 6, animate: animate && currentView === "day" });

      document.getElementById("dayChart").setAttribute("aria-label", `Washers and dryers in use, ${DAY_NAMES[dayIdx]} of last full week, 24 hour view`);
    }

    // Hover guides and tooltip follow the selected data points.
    function attachChartHover(svgId, tooltipId, getPayload) {
      const svg     = document.getElementById(svgId);
      const tooltip = document.getElementById(tooltipId);

      function moveHover(element, x, y, animate) {
        // Start at the first hovered sample, then glide between samples.
        element.style.transition = animate ? "" : "none";
        element.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      }

      svg.addEventListener("mousemove", (e) => {
        const rect   = svg.getBoundingClientRect();
        const W      = +svg.dataset.W;
        const H      = +svg.dataset.H;
        const padL   = +svg.dataset.padL;
        const padT   = +svg.dataset.padT;
        const innerH = +svg.dataset.innerH;
        const innerW = +svg.dataset.innerW;
        const yMax   = +svg.dataset.yMax;

        const payload = getPayload();
        if (!payload) return;
        const animate = tooltip.style.opacity === "1";
        const n      = payload.labels.length;
        const xStep  = innerW / (n - 1);
        const y      = v => padT + innerH - (v / yMax) * innerH;

        const viewBoxX = ((e.clientX - rect.left) / rect.width) * W;
        const dataX    = (viewBoxX - padL) / xStep;
        const idx      = Math.max(0, Math.min(n - 1, Math.round(dataX)));
        const vbX      = padL + idx * xStep;
        const washerY  = y(payload.series.w[idx]);
        const dryerY   = y(payload.series.d[idx]);
        const midY     = (washerY + dryerY) / 2;
        // Merge guides within 12 screen pixels, regardless of SVG scaling.
        const mergeGuides = Math.abs(washerY - dryerY) * rect.height / H <= 12;
        const svgPx    = (vbX / W) * rect.width;
        const svgPy    = (midY / H) * rect.height;

        const hoverLineX = svg.querySelector(".hover-line-x");
        const hoverLineW = svg.querySelector(".hover-line-y-w");
        const hoverLineD = svg.querySelector(".hover-line-y-d");
        const hoverDotW = svg.querySelector(".hover-dot-w");
        const hoverDotD = svg.querySelector(".hover-dot-d");
        if (hoverLineX) {
          moveHover(hoverLineX, vbX, 0, animate);
          hoverLineX.style.opacity = "0.7";
        }
        if (hoverLineW) {
          const guideY = mergeGuides ? midY : washerY;
          moveHover(hoverLineW, 0, guideY, animate);
          hoverLineW.style.opacity = "0.7";
        }
        if (hoverLineD) {
          moveHover(hoverLineD, 0, mergeGuides ? midY : dryerY, animate);
          hoverLineD.style.opacity = mergeGuides ? "0" : "0.7";
        }
        if (hoverDotW) {
          moveHover(hoverDotW, vbX, washerY, animate);
          hoverDotW.style.opacity = "1";
        }
        if (hoverDotD) {
          moveHover(hoverDotD, vbX, dryerY, animate);
          hoverDotD.style.opacity = "1";
        }

        tooltip.innerHTML =
          `<span class="tt-label">${payload.labels[idx]}</span>` +
          `<span class="tt-row"><span class="sw sw-w"></span><span class="tt-series-name">Washers</span><strong class="tt-value">${payload.series.w[idx]}</strong></span>` +
          `<span class="tt-row"><span class="sw sw-d"></span><span class="tt-series-name">Dryers</span><strong class="tt-value">${payload.series.d[idx]}</strong></span>`;
        // Keep the tooltip beside the points, flipping near chart edges.
        const gap = 12;
        const inset = 8;
        const tooltipWidth = tooltip.offsetWidth;
        const tooltipHeight = tooltip.offsetHeight;
        let left = svgPx + gap;
        let top = svgPy + gap;
        if (left + tooltipWidth > rect.width - inset) left = svgPx - tooltipWidth - gap;
        if (top + tooltipHeight > rect.height - inset) top = svgPy - tooltipHeight - gap;
        left = Math.max(inset, Math.min(rect.width - tooltipWidth - inset, left));
        top = Math.max(inset, Math.min(rect.height - tooltipHeight - inset, top));
        moveHover(tooltip, left, top, animate);
        tooltip.style.opacity = "1";
      });

      svg.addEventListener("mouseleave", () => {
        const hoverLineX = svg.querySelector(".hover-line-x");
        const hoverLineW = svg.querySelector(".hover-line-y-w");
        const hoverLineD = svg.querySelector(".hover-line-y-d");
        const hoverDotW = svg.querySelector(".hover-dot-w");
        const hoverDotD = svg.querySelector(".hover-dot-d");
        for (const element of [hoverLineX, hoverLineW, hoverLineD, hoverDotW, hoverDotD, tooltip]) {
          if (!element) continue;
          element.style.transition = "";
          element.style.opacity = "0";
        }
      });
    }

    // Wire hover once at init (the SVG element persists across renders; only its
    // children are replaced when renderCharts swaps the chart content).
    attachChartHover("weekChart", "weekTooltip", () => currentWeekPayload);
    attachChartHover("dayChart",  "dayTooltip",  () => currentDayPayload);

    function setView(view, dayIdx, animate = true) {
      if (view === currentView && (view !== "day" || dayIdx === currentDayIdx)) return;
      currentView = view;
      if (typeof dayIdx === "number") currentDayIdx = dayIdx;
      document.getElementById("weekPanel").classList.toggle("hidden", view !== "week");
      document.getElementById("dayPanel").classList.toggle("hidden", view !== "day");
      document.querySelectorAll(".range [data-view]").forEach(b => {
        const isMatch =
          (view === "week" && b.dataset.view === "week") ||
          (view === "day"  && b.dataset.view === "day"  && Number(b.dataset.day) === currentDayIdx);
        b.classList.toggle("active", isMatch);
      });
      updateRangeThumb(animate);
      renderCharts(animate);
    }

    document.querySelectorAll(".range [data-view]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (btn.dataset.view === "day") setView("day", Number(btn.dataset.day), e.detail !== 0);
        else setView("week", undefined, e.detail !== 0);
      });
    });

    // Slide the range thumb to whichever pill currently holds .active.
    function updateRangeThumb(animate) {
      const range = document.querySelector(".range");
      const thumb = range && range.querySelector(".range-thumb");
      const active = range && range.querySelector(".pill.active");
      if (!thumb || !active) return;
      const left   = active.offsetLeft;
      const top    = active.offsetTop;
      const width  = active.offsetWidth;
      const height = active.offsetHeight;
      if (!animate) thumb.style.transition = "none";
      thumb.style.left   = left   + "px";
      thumb.style.top    = top    + "px";
      thumb.style.width  = width  + "px";
      thumb.style.height = height + "px";
      if (!animate) {
        // Force a reflow so the no-transition values stick before we re-enable.
        void thumb.offsetHeight;
        thumb.style.transition = "";
      }
    }
    updateRangeThumb(false);
    let chartResizeFrame;
    window.addEventListener("resize", () => {
      updateRangeThumb(false);
      cancelAnimationFrame(chartResizeFrame);
      chartResizeFrame = requestAnimationFrame(() => renderCharts());
    });

    // Animate on press; switch to direct movement once a drag starts.
    const rangeEl   = document.querySelector(".range");
    const thumbEl  = rangeEl && rangeEl.querySelector(".range-thumb");
    const rangePills = rangeEl ? [...rangeEl.querySelectorAll(".pill")] : [];

    function findClosestPill(cursorX) {
      let best = rangePills[0];
      let bestDist = Infinity;
      for (const p of rangePills) {
        const c = p.offsetLeft + p.offsetWidth / 2;
        const d = Math.abs(c - cursorX);
        if (d < bestDist) { bestDist = d; best = p; }
      }
      return best;
    }
    function applyViewForPill(pill) {
      const view = pill.dataset.view;
      const dayIdx = pill.dataset.day !== undefined ? Number(pill.dataset.day) : undefined;
      currentView = view;
      if (typeof dayIdx === "number") currentDayIdx = dayIdx;
      document.getElementById("weekPanel").classList.toggle("hidden", view !== "week");
      document.getElementById("dayPanel").classList.toggle("hidden", view !== "day");
    }

    let dragState = null;
    rangeEl.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return; // primary button only
      if (!e.target.classList.contains("pill")) return;
      const pill = e.target;
      setView(pill.dataset.view, pill.dataset.view === "day" ? Number(pill.dataset.day) : undefined);
      dragState = {
        pointerId: e.pointerId,
        startX: e.clientX,
        startLeft: pill.offsetLeft,
        pill,
        dragged: false,
      };
    });
    rangeEl.addEventListener("pointermove", (e) => {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      const dx = e.clientX - dragState.startX;
      if (!dragState.dragged && Math.abs(dx) > 3) {
        dragState.dragged = true;
        stopChartAnimation(document.getElementById(currentView === "week" ? "weekChart" : "dayChart"));
        // Capture only drags so ordinary clicks still target the button.
        rangeEl.setPointerCapture(e.pointerId);
        thumbEl.style.transition = "none";
        thumbEl.style.top = dragState.pill.offsetTop + "px";
        thumbEl.style.width = dragState.pill.offsetWidth + "px";
        thumbEl.style.height = dragState.pill.offsetHeight + "px";
      }
      if (!dragState.dragged) return;

      const newLeft = dragState.startLeft + dx;
      const firstPill = rangePills[0];
      const lastPill  = rangePills[rangePills.length - 1];
      const minLeft   = firstPill.offsetLeft;
      const maxLeft   = lastPill.offsetLeft + lastPill.offsetWidth - thumbEl.offsetWidth;
      thumbEl.style.left = Math.max(minLeft, Math.min(maxLeft, newLeft)) + "px";

      const thumbCenter = thumbEl.offsetLeft + thumbEl.offsetWidth / 2;
      const best = findClosestPill(thumbCenter);
      if (!best.classList.contains("active")) {
        rangePills.forEach(p => p.classList.toggle("active", p === best));
        applyViewForPill(best);
        renderCharts();
      }
    });
    const endDrag = (e) => {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      const wasDragged = dragState.dragged;
      dragState = null;
      try { rangeEl.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
      thumbEl.style.transition = "";
      if (wasDragged) {
        // Snap to the pill whose chart was already rendered during the drag.
        updateRangeThumb(false);
      }
      // Without a drag, let the animation started on pointerdown continue.
    };
    rangeEl.addEventListener("pointerup", endDrag);
    rangeEl.addEventListener("pointercancel", endDrag);
    rangeEl.addEventListener("pointerleave", () => {
      if (dragState && !dragState.dragged) dragState = null;
    });

    renderCharts();

    // Pill toggles
    document.querySelectorAll(".group [data-range]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".group [data-range]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    // Refresh button: mock feedback with one uninterrupted half-turn.
    const refreshButton = document.getElementById("refresh");
    const startRefreshSpin = () => {
      const icon = document.querySelector("#refresh .refresh-icon");
      if (!icon || icon.classList.contains("is-spinning") ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const finishSpin = () => {
        icon.classList.remove("is-spinning");
        icon.removeEventListener("animationend", finishSpin);
        icon.removeEventListener("animationcancel", finishSpin);
      };
      icon.addEventListener("animationend", finishSpin);
      icon.addEventListener("animationcancel", finishSpin);
      icon.classList.add("is-spinning");
    };
    refreshButton.addEventListener("pointerdown", event => {
      if (event.button === 0) startRefreshSpin();
    });
    refreshButton.addEventListener("click", event => {
      // Keyboard and assistive activation have no preceding pointer press.
      if (event.detail === 0) startRefreshSpin();
    });

    // ---------- Theme toggle ----------
    // Cycles: light → dark → system → light. Default = system (respect OS preference).
    const THEME_ORDER = ["light", "dark", "system"];
    const THEME_ICONS = {
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
      dark:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    };
    const themeBtn   = document.getElementById("themeToggle");
    const themeIcon  = document.getElementById("themeIcon");
    const themeLabel = document.getElementById("themeLabel");

    function readSavedTheme() {
      try { return localStorage.getItem("spinsight-theme") || "system"; }
      catch (e) { return "system"; }
    }
    function saveTheme(mode) {
      try { localStorage.setItem("spinsight-theme", mode); } catch (e) { /* ignore */ }
    }
    function themeLabelText(mode) {
      return mode === "system" ? "Auto" : mode.charAt(0).toUpperCase() + mode.slice(1);
    }
    function applyTheme(mode) {
      if (mode === "light" || mode === "dark") {
        document.documentElement.setAttribute("data-theme", mode);
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
      saveTheme(mode);
      themeIcon.innerHTML  = THEME_ICONS[mode];
      const label = themeLabelText(mode);
      themeLabel.textContent = label;
      themeBtn.setAttribute("title", "Theme: " + label);
      if (currentWeekPayload) renderCharts();
    }

    applyTheme(readSavedTheme());
    themeBtn.addEventListener("click", () => {
      const idx = THEME_ORDER.indexOf(
        document.documentElement.getAttribute("data-theme") || "system"
      );
      applyTheme(THEME_ORDER[(idx + 1) % THEME_ORDER.length]);
    });
  </script>
</body>
</html>
